<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きなこ わんこオーバーレイ</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
canvas{display:block;position:fixed;left:0;bottom:0}
.status{display:none;position:fixed;left:8px;top:8px;font:700 13px sans-serif;color:#fff;background:#555;border-radius:8px;padding:4px 10px}
body.debug .status{display:block}
.status.ok{background:#2f8f46}.status.ng{background:#b8443a}
.status small{display:block;font-weight:400;opacity:.85}
body.preview{background:#c4e6f6;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
body.preview canvas{position:static;margin-top:12px;background:linear-gradient(#c4e6f6 0 92%,#8fd17a 92%)}
.note{display:none;margin:12px;padding:10px 12px;background:#fffaf0;color:#4a3020;border-radius:10px;font-size:14px;line-height:1.6}
body.preview .note{display:block}
</style>
</head>
<body>
<canvas id="lcd"></canvas>
<div id="status" class="status"></div>
<script>
// ===== 初期設定（承認パネルからリアルタイムで変更できます）=====
const SETTINGS_WS_URL = 'ws://localhost:21213/';
const SPAWN_GIFT_IDS = [7934];
// ===========================================
(function(){
const qs=new URLSearchParams(location.search);
if(qs.has('debug'))document.body.classList.add('debug');
const WS_URL=qs.get('ws')||SETTINGS_WS_URL;
const KEY='wanko-overlay-v3',CKEY='wanko-cfg-v1',AKEY='wanko-approved-v1';
const DEFAULT_CFG={hpSec:60,maxDogs:15,size:parseFloat(qs.get('size'))||1,walk:1,homeSpeed:3,crySec:2,feedPct:100,feedAny:true,spawn:['heart me','ハートミー'],showBar:true,showNames:true,paused:false};
let cfg={...DEFAULT_CFG};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CKEY)||'{}'));}catch(e){}
function clampCfg(){
 cfg.hpSec=Math.min(3600,Math.max(5,+cfg.hpSec||60));
 cfg.maxDogs=Math.min(15,Math.max(1,Math.round(+cfg.maxDogs||15)));
 cfg.size=Math.min(4,Math.max(0.3,+cfg.size||1));
 cfg.walk=Math.min(6,Math.max(0,+cfg.walk));
 cfg.homeSpeed=Math.min(10,Math.max(1,+cfg.homeSpeed||3));
 cfg.crySec=Math.min(10,Math.max(0,+cfg.crySec));
 cfg.feedPct=Math.min(100,Math.max(1,+cfg.feedPct||100));
 if(!Array.isArray(cfg.spawn))cfg.spawn=DEFAULT_CFG.spawn;
 cfg.spawn=cfg.spawn.map(v=>String(v).trim().toLowerCase()).filter(Boolean).slice(0,20);
 cfg.feedAny=!!cfg.feedAny;cfg.showBar=!!cfg.showBar;cfg.showNames=!!cfg.showNames;cfg.paused=!!cfg.paused;
}
clampCfg();
function saveCfg(){try{localStorage.setItem(CKEY,JSON.stringify(cfg));}catch(e){}}

let W=316,H=26,G=25,HOUSE_X=W-15,ROAM_MAX=W-36;
const c=document.getElementById('lcd'),x=c.getContext('2d');
let S=4;
const BASE={'1':'#2a1e18',w:'#fffaf0',n:'#1a100c',c:'#f7a8b0',t:'#e8707a',s:'#7fbfe8',b:'#7a5236',r:'#3f5f7a',v:'#b77b47',d:'#2a1e18'};
const COATS=[{o:'#f0b25e'},{o:'#3b3330','1':'#0f0a08',c:'#d98a8f'},{o:'#f1e3c8'},{o:'#d9772f'},{o:'#a8835e'}];
const HD=["..11......11..",".1oo1....1oo1.",".1ooo1111ooo1.","1oooooooooooo1","1ooo1oooo1ooo1","1ooo1oooo1ooo1","1wcwwwnnwwwcw1",".1wwwwwwwwww1.","..11wwwwww11.."];
const SIT=HD.map(r=>r+"..").concat(["..1owwwwwwo1..11","..1owwwwwwo1.1o1","..1ow1ww1wo11w1.","..1ww1ww1ww1....","...11111111....."]);
const EAT=SIT.slice();EAT[4]="1oooooooooooo1..";EAT[5]="1oo11oooo11oo1..";EAT[7]=".1wwwwttwwww1...";
const CRY1=SIT.slice();CRY1[3]="1oo11oooo11oo1..";CRY1[6]="1wcwswnnwswcw1..";CRY1[7]=".1wwsw11wsww1...";
const CRY2=CRY1.slice();CRY2[6]="1wcwwwnnwwwcw1..";CRY2[8]="..11swwwws11....";
const WALK=["...."+HD[0],"...."+HD[1],"...."+HD[2],"11.."+HD[3],"1o1."+HD[4],"1o11"+HD[5],"1ooo"+HD[6],"1oooo1wwwwwwwwww1.","1ooooo11wwwwww11..","1oooooowwwwww1....",".1o1o1...1o1o1....",".1w1w1...1w1w1....",".11111...11111...."];
const WCRY1=WALK.slice();WCRY1[3]="11.."+"1oo11oooo11oo1";WCRY1[6]="1ooo"+"1wcwswnnwswcw1";WCRY1[7]="1oooo1wwsw11wsww1.";
const WCRY2=WCRY1.slice();WCRY2[6]="1ooo"+HD[6];WCRY2[8]="1ooooo11swwwws11..";
const TREAT=["b..b","bbbb","b..b"];
const HOUSE=["......11......",".....1rr1.....","....1rrrr1....","...1rrrrrr1...","..1rrrrrrrr1..",".1rrrrrrrrrr1.","11111111111111",".1vvvv11vvvv1.",".1vvv1dd1vvv1.",".1vvv1dd1vvv1.",".1vvv1dd1vvv1.",".1vvv1dd1vvv1.",".111111111111."];


let dogs=[];
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1));}
const ROOM=(qs.get('room')||'').replace(/[^a-zA-Z0-9_-]/g,'');
let APPROVED={};try{APPROVED=JSON.parse(localStorage.getItem(AKEY)||'{}')||{};}catch(e){}
function saveApproved(){try{localStorage.setItem(AKEY,JSON.stringify(APPROVED));}catch(e){}}
function shownName(nick,id){return (id&&APPROVED[id]===nick)?nick:'リスナー';}

function load(){
 try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||!Array.isArray(v.dogs))return;
  const lost=cfg.paused?0:(Date.now()-v.at)/(cfg.hpSec*1000)*100;
  dogs=v.dogs.map(d=>({...d,hp:Math.max(0,(+d.hp||0)-lost),st:'live',dir:1,idle:0,anim:0,timer:0})).filter(d=>d.hp>0).slice(0,cfg.maxDogs);
 }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({at:Date.now(),dogs:dogs.filter(d=>d.st!=='home').map(d=>({id:d.id,nick:d.nick,coat:d.coat,hp:d.hp,x:d.x}))}));}catch(e){}}

function sendHome(d){d.st='home';d.dir=1;d.anim=0;d.idle=0;}
function trimDogs(){
 const live=dogs.filter(d=>d.st!=='home');
 if(live.length<=cfg.maxDogs)return;
 live.sort((a,b)=>a.hp-b.hp).slice(0,live.length-cfg.maxDogs).forEach(sendHome);
}
function gift(id,nick,spawn){
 id=String(id||'anon');nick=String(nick||id).slice(0,12);
 let d=dogs.find(v=>v.id===id);
 if(!d&&!spawn)return;
 if(d&&!spawn&&!cfg.feedAny)return;
 if(!d){
  const live=dogs.filter(v=>v.st!=='home');
  if(live.length>=cfg.maxDogs){let worst=live[0];for(const v of live)if(v.hp<worst.hp)worst=v;dogs.splice(dogs.indexOf(worst),1);}
  const used=new Set(dogs.map(v=>v.coat));let coat=rand(0,COATS.length-1);
  for(let i=0;i<COATS.length;i++)if(!used.has(i)){coat=i;break;}
  d={id,nick,coat,x:HOUSE_X,dir:-1,idle:0,anim:0,timer:rand(10,30),st:'out',hp:0};
  dogs.push(d);
 }
 d.nick=nick;d.hp=Math.min(100,d.hp+cfg.feedPct);
 if(d.st==='cry'||d.st==='home')d.st='live';
 if(d.st==='live'){d.anim=10;d.idle=0;}
 save();
}

function dot(gx,gy,col){x.fillStyle=col;x.fillRect(Math.floor(gx*S),Math.floor(gy*S),Math.ceil(S),Math.ceil(S));}
function spr(a,ox,oy,flip,pal){a.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=flip?r[r.length-1-i]:r[i];if(ch!=='.')dot(ox+i,oy+j,(pal&&pal[ch])||BASE[ch]);}});}
function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}

function label(d,cx,topRow){
 const bw=S*13,bh=Math.max(5,S*1.2);
 let bx=cx-bw/2;bx=Math.max(2,Math.min(c.width-bw-2,bx));
 const by=(topRow-1.6)*S;
 if(cfg.showBar){
  const h=d.hp;
  x.fillStyle='rgba(20,15,10,.75)';rr(bx-1.5,by-1.5,bw+3,bh+3,(bh+3)/2);x.fill();
  x.fillStyle='#e9e4da';rr(bx,by,bw,bh,bh/2);x.fill();
  if(h>0){x.fillStyle=h>50?'#58c25a':h>20?'#f2b63c':'#e2574c';rr(bx,by,Math.max(bh,bw*h/100),bh,bh/2);x.fill();}
 }
 if(cfg.showNames){
  const fs=Math.max(11,S*3);
  x.font='700 '+fs+'px "Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';
  x.textAlign='center';x.textBaseline='bottom';
  const name=shownName(d.nick,d.id);const ty=cfg.showBar?by-3:by+bh;
  const tx=Math.max(x.measureText(name).width/2+2,Math.min(c.width-x.measureText(name).width/2-2,cx));
  x.lineWidth=Math.max(3,fs/4);x.strokeStyle='rgba(20,15,10,.85)';x.lineJoin='round';
  x.strokeText(name,tx,ty);x.fillStyle='#ffffff';x.fillText(name,tx,ty);
 }
}

function drawDog(d){
 const pal={...BASE,...COATS[d.coat]};const X=Math.round(d.x);let top,headX=X;
 if(d.st==='cry'){top=G-14;spr(t%4<2?CRY1:CRY2,X,top,false,pal);}
 else if(d.st==='home'){top=G-13-(t%2);spr(t%2?WCRY2:WCRY1,X,top,false,pal);headX=X+4;
  for(let k=1;k<=3;k++){const age=(t+k*2)%6;dot(X-k*2-age,top+6+Math.floor(age/2),'#7fbfe8');}}
 else if(d.st==='out'){top=G-13;spr(WALK,X,top,d.dir<0,pal);headX=d.dir<0?X:X+4;}
 else if(d.anim>0){top=G-14-(t%2);spr(EAT,X,top,false,pal);if(d.anim>4)spr(TREAT,X+15,G-4,false,pal);}
 else if(d.idle>0){top=G-14;spr(SIT,X,top,false,pal);}
 else{top=G-13;spr(WALK,X,top,d.dir<0,pal);headX=d.dir<0?X:X+4;}
 return {cx:(headX+7)*S,top};
}

function draw(){
 x.clearRect(0,0,c.width,c.height);
 const back=dogs.filter(d=>d.st==='home'||d.st==='out'),front=dogs.filter(d=>d.st!=='home'&&d.st!=='out');
 const labels=[];
 for(const d of back)labels.push([d,drawDog(d)]);
 spr(HOUSE,HOUSE_X,G-13,false,BASE);
 for(const d of front)labels.push([d,drawDog(d)]);
 for(const [d,p] of labels)if(d.st!=='home')label(d,p.cx,p.top);
}

let t=0,lastT=performance.now();
function tick(){
 t++;
 const now=performance.now(),dt=now-lastT;lastT=now;
 const drain=cfg.paused?0:dt/(cfg.hpSec*1000)*100;
 for(const d of dogs.slice()){
  if(d.st==='out'){d.x-=1;d.dir=-1;if(--d.timer<=0||d.x<=ROAM_MAX)d.st='live';continue;}
  if(d.st==='cry'){if(--d.timer<=0)sendHome(d);continue;}
  if(d.st==='home'){d.x+=cfg.homeSpeed;d.dir=1;if(d.x>=HOUSE_X){dogs.splice(dogs.indexOf(d),1);save();}continue;}
  d.hp=Math.max(0,d.hp-drain);
  if(d.anim>0){d.anim--;continue;}
  if(d.hp<=0){d.st='cry';d.timer=Math.round(cfg.crySec*4);d.idle=0;if(d.timer<=0)sendHome(d);continue;}
  if(d.idle>0){d.idle--;continue;}
  if(cfg.walk>0){d.x+=d.dir*0.5*cfg.walk;if(d.x>ROAM_MAX||d.x<0){d.dir*=-1;d.x=Math.max(0,Math.min(ROAM_MAX,d.x));}}
  if(Math.random()<0.02)d.idle=rand(8,20);
  if(Math.random()<0.01)d.dir*=-1;
 }
 draw();
 if(t%20===0)save();
}

function resize(){
 const dpr=window.devicePixelRatio||1;
 const cw=Math.max(1,window.innerWidth),ch=Math.max(1,window.innerHeight);
 let cssS=Math.max(1.5,cw/210*cfg.size);
 cssS=Math.min(cssS,ch/20);
 W=Math.max(40,Math.floor(cw/cssS));H=Math.max(20,Math.floor(ch/cssS));G=H-1;
 HOUSE_X=W-15;ROAM_MAX=Math.max(0,W-36);
 c.width=Math.round(cw*dpr);c.height=Math.round(ch*dpr);S=cssS*dpr;
 c.style.width=cw+'px';c.style.height=ch+'px';
 for(const d of dogs){if(d.x>HOUSE_X)d.x=HOUSE_X;if(d.st==='live'&&d.x>ROAM_MAX)d.x=ROAM_MAX;}
 draw();
}
window.addEventListener('resize',resize);

function applyCfg(n){
 const old=cfg.size;
 Object.assign(cfg,n||{});clampCfg();saveCfg();
 if(cfg.size!==old)resize();
 trimDogs();
}
function action(a){
 if(a==='feedAll'){for(const d of dogs){if(d.st==='home'||d.st==='cry')d.st='live';d.hp=100;if(d.st==='live'){d.anim=10;d.idle=0;}}}
 else if(a==='homeAll'){for(const d of dogs)if(d.st!=='home')sendHome(d);}
 else if(a==='reset'){dogs=[];}
 save();
}

let roomOk=false;
function listenRoom(){
 if(!ROOM)return;
 const es=new EventSource('https://ntfy.sh/kinako-'+ROOM+'/sse?since=all');
 es.onopen=()=>{roomOk=true;};
 es.onerror=()=>{roomOk=false;};
 es.onmessage=ev=>{
  let o;try{o=JSON.parse(ev.data);}catch(e){return;}
  if(o.event&&o.event!=='message')return;
  let m;try{m=JSON.parse(o.message);}catch(e){return;}
  if(!m)return;
  if(m.t==='approve'&&typeof m.id==='string'&&typeof m.nick==='string'){APPROVED[m.id]=m.nick.slice(0,12);saveApproved();}
  else if(m.t==='revoke'&&typeof m.id==='string'){delete APPROVED[m.id];saveApproved();}
  else if(m.t==='config'&&m.cfg&&typeof m.cfg==='object'){applyCfg(m.cfg);}
  else if(m.t==='action'&&typeof m.a==='string'&&Date.now()-(+m.ts||0)<15000){action(m.a);}
 };
}

const st=document.getElementById('status');
let wsOk=false;
function showStatus(){
 st.innerHTML='';
 st.append((wsOk?'TikFinity：接続中':'TikFinity：再接続中…')+'（犬 '+dogs.filter(d=>d.st!=='home').length+'匹）'+(ROOM?(roomOk?' ／ パネル：接続中':' ／ パネル：未接続'):' ／ パネル：未設定'));
 const sm=document.createElement('small');
 sm.textContent='HP '+cfg.hpSec+'秒 ／ 最大'+cfg.maxDogs+'匹 ／ 大きさ×'+cfg.size+(cfg.paused?' ／ 一時停止中':'');
 st.append(sm);st.className='status '+(wsOk&&(!ROOM||roomOk)?'ok':'ng');
}
setInterval(showStatus,1000);

let retry=1000;
function connect(){
 let ws;
 try{ws=new WebSocket(WS_URL);}catch(e){wsOk=false;setTimeout(connect,retry);return;}
 ws.onopen=()=>{retry=1000;wsOk=true;};
 ws.onmessage=ev=>{
  let m;try{m=JSON.parse(ev.data);}catch(e){return;}
  if(!m||(m.event||m.type)!=='gift')return;
  const d=m.data||{},u=d.user||{};
  const id=u.uniqueId||d.uniqueId||u.userId||d.userId||u.nickname||d.nickname;
  const gname=String(d.giftName||(d.gift&&d.gift.name)||'').trim().toLowerCase();
  const gid=Number(d.giftId||(d.gift&&d.gift.id)||0);
  const spawn=cfg.spawn.includes(gname)||SPAWN_GIFT_IDS.includes(gid);
  gift(id,u.nickname||d.nickname||id,spawn);
 };
 ws.onclose=()=>{wsOk=false;setTimeout(connect,retry);retry=Math.min(retry*2,10000);};
 ws.onerror=()=>{try{ws.close();}catch(e){}};
}

document.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();const n=rand(1,20);gift('test-'+n,'テスト'+n,true);}
 if(e.key==='o'){const n=rand(1,20);gift('test-'+n,'テスト'+n,false);}
 if(e.key==='R'&&e.shiftKey){dogs=[];save();}
});

load();resize();connect();listenRoom();showStatus();
setInterval(tick,250);
})();
</script>
</body>
</html>
